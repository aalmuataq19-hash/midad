<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FAF9F6">
<title>مِداد القاضي</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F4D3D'/%3E%3Ctext x='32' y='42' font-size='30' text-anchor='middle' fill='%23FAF9F6' font-family='sans-serif' font-weight='700'%3Eم%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
<style>
  html, body { margin: 0; background: #FAF9F6; }
  body { font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; }
  #boot { min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #8A8378; font-size: 14px; text-align: center; padding: 24px; line-height: 1.8; }
</style>
</head>
<body>
<div id="root"><div id="boot">يحمّل مِداد…</div></div>
<script>
window.addEventListener("error", function (e) {
  var b = document.getElementById("boot");
  if (b) b.innerHTML = "تعذر تشغيل التطبيق: " + (e.message || "خطأ غير معروف") + "<br><span style='font-size:12px'>أعد تحميل الصفحة. إن استمر الخطأ فافتح الموقع في Chrome أو Edge أو Safari حديث.</span>";
});
if (!window.React || !window.ReactDOM) {
  document.getElementById("boot").innerHTML = "لم تُحمَّل مكتبة الواجهة. تأكد من الاتصال بالإنترنت ثم أعد تحميل الصفحة.";
}
</script>

<script src="app.js?v=2"></script>
</body>
</html>
